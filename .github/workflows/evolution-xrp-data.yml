name: Evolution Lab XRP Historical Data
on:
  workflow_dispatch:
  schedule:
    - cron: "23 1 * * *"
permissions:
  contents: write
concurrency:
  group: evolution-lab-xrp-data
  cancel-in-progress: false
jobs:
  update-research-data:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch verified Kraken hourly XRP/EUR closes
        run: python evolution-lab/fetch_xrp_csv.py
      - name: Commit public research CSV only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evolution-lab/data/xrp_eur_1h.csv
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Evolution Lab public XRP/EUR research candles"
            git push
          fi
