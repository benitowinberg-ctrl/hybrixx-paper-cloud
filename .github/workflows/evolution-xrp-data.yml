name: Evolution Lab XRP Historical Data
on:
  push:
    paths:
      - 'research_engine.py'
      - 'ten_paper_engine.py'
      - 'tests/test_ten_paper_engine.py'
      - '.github/workflows/evolution-xrp-data.yml'
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"
permissions:
  contents: write
concurrency:
  group: evolution-lab-xrp-data
  cancel-in-progress: false
jobs:
  update-research-data:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Fetch verified Kraken hourly XRP/EUR closes
        run: python evolution-lab/fetch_xrp_csv.py
      - name: Run integrated autonomous research
        run: python research_engine.py
      - name: Run ten paper research systems
        run: python ten_paper_engine.py
      - name: Validate research report
        run: |
          python -m unittest discover -s tests -p 'test_intelligence_core.py' -v
          python -m unittest discover -s tests -p 'test_learning_history.py' -v
          python -m unittest discover -s tests -p 'test_ten_paper_engine.py' -v
      - name: Commit public research data and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evolution-lab/data/xrp_eur_1h.csv research_state.json learning_history.json ten_paper_state.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh HYBRIXX market data and integrated research"
            git push
          fi
