name: HYBRIXX Multi-Coin Paper 10 (SIMULATION)
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: read
concurrency:
  group: hybrixx-multi-paper
  cancel-in-progress: false
jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Enforce paper-only policy and validate legacy ledger
        run: |
          python security_check.py
          python security_sentinel.py
          python security/production_guard.py
      - name: Check multicoin syntax and migration
        run: |
          python -m compileall -q multi_paper.py paper_trade_gate.py migrate_xrp_state.py research_backtest.py
          python -m unittest discover -s tests -p 'test_migrate_xrp.py' -v
          python -m unittest discover -s tests -p 'test_paper_health.py' -v
          python -m unittest discover -s tests -p 'test_paper_trade_gate.py' -v
      - name: Run multi-coin simulation using single migrated account
        run: python multi_paper.py
      - name: Verify account accounting and paper-only policy
        run: |
          python security/production_guard.py
          python paper_health.py --max-age-minutes 15
          python -c "import json,math; s=json.load(open('multi_state.json')); assert s['mode']=='PAPER_ONLY_DEVELOPMENT'; assert s['cash_eur']>=0; assert len(s['positions'])<=3; assert math.isclose(s['equity_eur'],s['cash_eur']+sum(q*s['latest_prices_eur'][c] for c,q in s['positions'].items()),abs_tol=.02)"
      - name: Publish multi-coin paper journal
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add multi_state.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update HYBRIXX ten-market paper account'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
