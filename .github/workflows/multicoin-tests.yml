name: HYBRIXX 10 Coin Paper Tests
on:
  workflow_dispatch:
  push:
    branches: [dev/multicoin-paper-10]
    paths: ['multi_paper.py', 'tests/test_multi_paper.py', '.github/workflows/multicoin-tests.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
