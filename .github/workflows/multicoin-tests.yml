name: HYBRIXX Multi-Coin Research Tests (NO LIVE ORDERS)
on:
  workflow_dispatch:
  push:
    branches: [dev/multicoin-paper-10]
    paths:
      - 'multi_paper.py'
      - 'research_backtest.py'
      - 'tests/**'
      - '.github/workflows/multicoin-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify syntax
        run: python -m compileall -q multi_paper.py research_backtest.py tests
      - name: Validate permanent paper-only production policy
        run: python security/production_guard.py
      - name: Run deterministic regression tests
        run: python -m unittest discover -s tests -v
