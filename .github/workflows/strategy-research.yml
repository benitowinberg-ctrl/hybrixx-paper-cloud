name: HYBRIXX Strategy Research (READ ONLY)
on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'
permissions:
  contents: write
concurrency:
  group: hybrixx-research
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Enforce paper-only policy and test strategy logic
        run: |
          python security/production_guard.py
          python -m unittest discover -s tests -p 'test_strategy_research.py' -v
          python -m unittest discover -s tests -p 'test_human_strategy_comparison.py' -v
          python -m unittest discover -s tests -p 'test_walkforward_research.py' -v
          python -m unittest discover -s tests -p 'test_historical_data_quality.py' -v
          python -m unittest discover -s tests -p 'test_shadow_arena.py' -v
          python -m unittest discover -s tests -p 'test_adaptive_lab.py' -v
          python -m unittest discover -s tests -p 'test_learning_engine.py' -v
          python -m unittest discover -s tests -p 'test_unified_intelligence.py' -v
          python -m unittest discover -s tests -p 'test_unified_learning_council.py' -v
          python -m unittest discover -s tests -p 'test_learning_governance.py' -v
      - name: Evaluate closed Kraken OHLC candles
        run: python strategy_research.py --interval 60 --output strategy_report.json
      - name: Evaluate conservative research gate
        run: python strategy_gate.py
      - name: Compare human-inspired strategies on independent historical holdout
        run: python human_strategy_comparison.py
      - name: Run quality-gated rolling walk-forward research
        run: python walkforward_research.py
      - name: Evaluate read-only bootstrap robustness
        run: python robustness_research.py
      - name: Run isolated 20-strategy Shadow Arena
        run: python shadow_arena.py
      - name: Run ten adaptive research diagnostics
        run: python adaptive_lab.py
      - name: Train and evaluate research-only online learning engine
        run: python learning_engine.py
      - name: Run ten learning governance controls and record bounded evaluation history
        run: python learning_governance.py
      - name: Synthesize unified research evidence
        run: python unified_intelligence.py
      - name: Publish research report (no account changes)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Preserve generated outputs; another workflow may have pushed since checkout.
          reports=(strategy_report.json strategy_gate_report.json human_strategy_comparison.json walkforward_report.json robustness_report.json shadow_arena_report.json adaptive_lab_report.json learning_engine_report.json learning_governance_report.json learning_governance_history.json unified_intelligence_report.json)
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          cp "${reports[@]}" "$temp_dir/"
          # Rebase-free publishing prevents conflicts between scheduled and manual runs.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp "$temp_dir"/*.json .
            git add "${reports[@]}"
            if git diff --cached --quiet; then
              echo "Reports already up to date"
              exit 0
            fi
            git commit -m 'Update read-only HYBRIXX strategy research report'
            if git push origin HEAD:main; then
              echo "Reports published"
              exit 0
            fi
            echo "Concurrent update detected; retrying publish ($attempt/3)"
            sleep 2
          done
          echo "Unable to publish reports after three attempts" >&2
          exit 1
