name: HYBRIXX Paper Health Watch
on:
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'
permissions:
  contents: read
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Validate simulated account and freshness
        run: |
          python security/production_guard.py
          python paper_health.py --max-age-minutes 60
      - name: Validate independent risk controls
        run: |
          python -m unittest discover -s tests -p 'test_risk_audit_suite.py' -v
          python risk_audit_suite.py
      - name: Verify unified intelligence invariants
        run: python -m unittest discover -s tests -p 'test_unified_intelligence.py' -v
      - name: Test universal AI offline foundation
        run: python -m unittest discover -s tests -p 'test_universal_ai.py' -v
