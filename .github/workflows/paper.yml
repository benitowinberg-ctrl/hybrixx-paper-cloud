name: HYBRIXX Paper Observation
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
concurrency:
  group: hybrixx-state
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run HYBRIXX v1.2 paper tests
        run: python -m unittest -v test_paper_engine.py
      - name: Fetch XRP quote and simulate paper trade
        run: python paper_engine.py
      - name: Save paper state to development branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update HYBRIXX v1.2 paper state'
            git push
          fi
