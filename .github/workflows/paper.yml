name: HYBRIXX Paper Trading (Simulation)
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches:
      - main
    paths:
      - 'paper_v2.py'
      - 'security/production_guard.py'
      - 'security/production_policy.json'
      - 'infra/**'
      - 'dashboard.js'
      - 'styles.css'
      - 'index.html'
      - 'hybrixx.html'
      - 'emergency_stop.py'
      - '.github/workflows/emergency-stop.yml'
      - 'tests/**'
      - '.github/workflows/paper.yml'
      - 'security_check.py'
      - 'security_sentinel.py'
      - '.github/workflows/security-sentinel.yml'
      - 'SECURITY.md'
      - '.gitignore'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: hybrixx-paper-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Check no credentials are tracked or exposed
        run: python security_check.py
      - name: Reject suspicious trading code and state changes
        run: python security_sentinel.py
      - name: Enforce permanent PAPER ONLY policy
        run: python security/production_guard.py
      - name: Verify dashboard JavaScript syntax
        run: node --check dashboard.js
      - name: Test paper-only execution and risk controls
        run: python -m unittest discover -s tests -v

  paper:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Block paper run if state or code looks tampered with
        run: |
          python security_check.py
          python security_sentinel.py
      - name: Observe market and run virtual-only strategy
        run: python paper_v2.py
      - name: Verify completed paper journal before publishing
        run: |
          python security_sentinel.py
          python security/production_guard.py
      - name: Commit paper journal
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update HYBRIXX paper state'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
